<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Lookup</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class ="card">
    <h1> 🔍 IP Lookup </h1>
    <p class="subtitle">Website-URL eingeben und IP-Adresse herausfinden</p>

    <div class="input-row">
      <input type="text" id="urlInput" placeholder="Z.B. www.github.com" />
      <button id="lookupBtn">Suchen</button>
    </div>

    <div id="result" class="result hidden"></div>
    <div id="error"  class="error hidden"></div>
  </div>
  
  <script src="js/script.js"></script>

</body>
</html>
